version: 2

models:
  - name: dim_customers
    description: "Customer dimension table with comprehensive metrics, RFM scoring, and lifetime value"
    columns:
      - name: source_customer_id
        description: "Unique customer identifier"
        tests:
          - unique
          - not_null
      - name: email
        description: "Customer email address"
        tests:
          - not_null
      - name: lifetime_value
        description: "Total revenue generated by customer"
      - name: total_orders
        description: "Total number of orders placed"
      - name: recency_score
        description: "RFM recency score (1-5)"
      - name: frequency_score
        description: "RFM frequency score (1-5)"
      - name: monetary_score
        description: "RFM monetary score (1-5)"
      - name: customer_order_segment
        description: "Customer segment based on order frequency"
      - name: customer_value_segment
        description: "Customer segment based on lifetime value"
      - name: recency_segment
        description: "Customer segment based on last order recency"

  - name: dim_products
    description: "Product dimension table with sales performance and inventory metrics"
    columns:
      - name: source_product_id
        description: "Unique product identifier"
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Product name"
        tests:
          - not_null
      - name: category
        description: "Product category"
      - name: brand
        description: "Product brand"
      - name: times_ordered
        description: "Number of times product was ordered"
      - name: total_quantity_sold
        description: "Total units sold"
      - name: total_revenue
        description: "Total revenue generated by product"
      - name: revenue_performance
        description: "Performance segment based on revenue"
      - name: popularity_segment
        description: "Popularity segment based on order frequency"
      - name: stock_health
        description: "Stock level health indicator"

  - name: fact_daily_sales
    description: "Daily aggregated sales metrics including orders, revenue, transactions, and KPIs"
    columns:
      - name: order_date
        description: "Date of sales activity"
        tests:
          - unique
          - not_null
      - name: total_orders
        description: "Total orders placed on date"
      - name: gross_revenue
        description: "Total revenue before refunds"
      - name: net_revenue
        description: "Net revenue after refunds"
      - name: unique_customers
        description: "Unique customers who ordered"
      - name: avg_order_value
        description: "Average order value"
      - name: order_fulfillment_rate
        description: "Percentage of orders fulfilled"
      - name: transaction_success_rate
        description: "Percentage of successful transactions"
      - name: revenue_per_customer
        description: "Average revenue per customer"

  - name: metric_customer_cohorts
    description: "Customer cohort analysis with retention and revenue metrics by registration month"
    columns:
      - name: registration_cohort_month
        description: "Month when customers registered"
        tests:
          - not_null
      - name: first_order_month
        description: "Month of first order"
      - name: order_month
        description: "Month of activity being measured"
      - name: months_since_first_order
        description: "Months elapsed since first order"
      - name: cohort_size
        description: "Total customers in cohort"
      - name: active_customers
        description: "Customers active in this period"
      - name: retention_rate
        description: "Percentage of cohort still active"
      - name: revenue_per_active_customer
        description: "Average revenue per active customer"

  - name: metric_product_performance
    description: "Detailed product performance metrics with category benchmarks"
    columns:
      - name: source_product_id
        description: "Unique product identifier"
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Product name"
        tests:
          - not_null
      - name: total_revenue
        description: "Total revenue generated"
      - name: total_units_sold
        description: "Total units sold"
      - name: performance_rating
        description: "Performance vs category peers"
      - name: sales_temperature
        description: "Sales recency indicator (Hot/Active/Cooling/Cold)"
      - name: inventory_health
        description: "Inventory level health status"
      - name: is_top_performer
        description: "Flag for above-median category performance"



